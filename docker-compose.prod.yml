# Self-hosting: the whole stack (postgres, minio, api, worker, web) in one command.
#   cp .env.example .env   # then set the required values (see README, Self-hosting section)
#   docker compose -f docker-compose.prod.yml up -d --build
# With development mail (Mailpit): add --profile mail and EMAIL_PROVIDER=smtp.
# Only "web" is published on the host (WEB_PORT); api, worker, postgres and minio stay on the internal network.
# Variables are read from the .env in the current folder; internal service addresses are fixed here and override
# the development ones (localhost) found in .env.
# Every variable listed in docs/ENVIRONMENT.md is passed through (a test checks it).

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-tt}:${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-team_tracker}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-team-tracker}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?imposta S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  PLATFORM_NAME: ${PLATFORM_NAME:-team-tracker}
  PLATFORM_URL: ${PLATFORM_URL:?imposta PLATFORM_URL}
  PLATFORM_SUPPORT_EMAIL: ${PLATFORM_SUPPORT_EMAIL:-support@example.com}
  PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
  PLATFORM_TIME_ZONE: ${PLATFORM_TIME_ZONE:-Europe/Rome}
  PLATFORM_AD_QUALITY_THRESHOLD: ${PLATFORM_AD_QUALITY_THRESHOLD:-6}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_DOMAIN: ${EMAIL_DOMAIN:-localhost}
  EMAIL_FROM_LOCAL: ${EMAIL_FROM_LOCAL:-noreply}
  EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-inbound.localhost}
  WEBHOOKS_ALLOW_PRIVATE: "false"
  AGENT_MODEL: ${AGENT_MODEL:-}
  FAST_MODEL: ${FAST_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  CV_MODEL_DAILY_BUDGET: ${CV_MODEL_DAILY_BUDGET:-1000}
  IMPORT_STALE_DAYS: ${IMPORT_STALE_DAYS:-7}
  DELIVERY_LOG_RETENTION_DAYS: ${DELIVERY_LOG_RETENTION_DAYS:-30}

name: ${COMPOSE_PROJECT_NAME:-team-tracker-prod}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-team_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # The MinIO community images are no longer published on Docker Hub: Chainguard build, pinned by digest (tag: latest).
    image: cgr.dev/chainguard/minio:latest@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?imposta S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks: [internal]

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [internal]

  api:
    build: { context: ., target: api }
    image: team-tracker-api:${TT_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      API_PORT: "4000"
      API_HOST: 0.0.0.0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?imposta BETTER_AUTH_SECRET (almeno 32 caratteri)}
      BETTER_AUTH_URL: ${PLATFORM_URL}
      WEB_ORIGIN: ${PLATFORM_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-}
      # The api trusts x-forwarded-for only from the internal network (where the web runs). Never "true".
      TRUST_PROXY: ${TRUST_PROXY:-${TT_SUBNET:-172.31.77.0/24}}
      APPLICATIONS_DAILY_MAX_PER_ORGANIZATION: ${APPLICATIONS_DAILY_MAX_PER_ORGANIZATION:-500}
      APPLICATIONS_DAILY_MAX_PER_JOB: ${APPLICATIONS_DAILY_MAX_PER_JOB:-200}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:?imposta INBOUND_WEBHOOK_SECRET (almeno 32 caratteri)}
    ports:
      - "${API_PUBLISH:-127.0.0.1:4000}:4000"
    networks: [internal]

  worker:
    build: { context: ., target: worker }
    image: team-tracker-worker:${TT_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *app-env
    networks: [internal]

  web:
    build:
      context: .
      target: web
      args:
        NUXT_PUBLIC_PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
    image: team-tracker-web:${TT_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NUXT_API_INTERNAL_URL: http://api:4000
      NUXT_PUBLIC_PLATFORM_NAME: ${PLATFORM_NAME:-team-tracker}
      NUXT_PUBLIC_PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
      NUXT_PUBLIC_SITE_URL: ${PLATFORM_URL}
      NUXT_PUBLIC_TIME_ZONE: ${NUXT_PUBLIC_TIME_ZONE:-Europe/Rome}
      NUXT_PUBLIC_SOURCE_URL: ${NUXT_PUBLIC_SOURCE_URL:-}
      NUXT_API_MAX_BODY_BYTES: ${NUXT_API_MAX_BODY_BYTES:-213909504}
      NUXT_API_TIMEOUT_MS: ${NUXT_API_TIMEOUT_MS:-300000}
      NUXT_TRUST_CLOUDFLARE: ${NUXT_TRUST_CLOUDFLARE:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: ${TT_SUBNET:-172.31.77.0/24}

volumes:
  pgdata:
  miniodata:
