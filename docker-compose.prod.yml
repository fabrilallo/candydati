# Self-hosting: the whole stack (postgres, minio, api, worker, web) in one command.
# One-command install on a fresh server (writes .env, adds Caddy for HTTPS, uses the published images): deploy/install.sh.
# By hand, from the sources:
#   cp .env.example .env   # then set the required values (see README, Self-hosting section)
#   docker compose -f docker-compose.prod.yml up -d --build
# Published images instead of a local build: set CANDYDATI_VERSION to a release (e.g. 0.2.0), then pull and up -d.
# With development mail (Mailpit): add --profile mail and EMAIL_PROVIDER=smtp. With scheduled backups: --profile backup.
# Only "web" is published on the host (WEB_BIND:WEB_PORT); api, worker, postgres and minio stay on the internal network.
# The stack refuses to start with the example secrets, an http PLATFORM_URL or EMAIL_PROVIDER=log (config-check).
# Variables are read from the .env in the current folder; internal service addresses are fixed here and override
# the development ones (localhost) found in .env.
# Every variable listed in docs/ENVIRONMENT.md is passed through (a test checks it).

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-candydati}:${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-candydati}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-candydati}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?imposta S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  PLATFORM_NAME: ${PLATFORM_NAME:-Candydati}
  PLATFORM_URL: ${PLATFORM_URL:?imposta PLATFORM_URL}
  PLATFORM_SUPPORT_EMAIL: ${PLATFORM_SUPPORT_EMAIL:-support@example.com}
  PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
  PLATFORM_TIME_ZONE: ${PLATFORM_TIME_ZONE:-Europe/Rome}
  PLATFORM_AD_QUALITY_THRESHOLD: ${PLATFORM_AD_QUALITY_THRESHOLD:-6}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:?imposta EMAIL_PROVIDER (smtp o resend)}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_DOMAIN: ${EMAIL_DOMAIN:-localhost}
  EMAIL_FROM_LOCAL: ${EMAIL_FROM_LOCAL:-noreply}
  # Empty: inbound.<EMAIL_DOMAIN>. Replies to reply+<token>@ that domain need an MX record and an inbound webhook.
  EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
  WEBHOOKS_ALLOW_PRIVATE: "false"
  AGENT_MODEL: ${AGENT_MODEL:-}
  FAST_MODEL: ${FAST_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  CV_MODEL_DAILY_BUDGET: ${CV_MODEL_DAILY_BUDGET:-1000}
  IMPORT_STALE_DAYS: ${IMPORT_STALE_DAYS:-7}
  DELIVERY_LOG_RETENTION_DAYS: ${DELIVERY_LOG_RETENTION_DAYS:-30}
  # Observability, all optional and off when empty (docs/OPERATIONS.md): nothing is sent anywhere by default.
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-${CANDYDATI_VERSION:-}}

name: ${COMPOSE_PROJECT_NAME:-candydati-prod}

services:
  # Refuses to start the stack with the example secrets of .env.example, short secrets, an http PLATFORM_URL or
  # EMAIL_PROVIDER=log (docker/config-check.sh). The api and the worker apply the same rules again at boot.
  config-check:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    restart: "no"
    command: ["sh", "/config-check.sh"]
    volumes:
      - ./docker/config-check.sh:/config-check.sh:ro
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      PLATFORM_URL: ${PLATFORM_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
    network_mode: none

  postgres:
    image: postgres:17@sha256:4d89c904835259bc58876520e56267ca07a4ebd6a027f7814bbbf91b50d685be
    restart: unless-stopped
    depends_on:
      config-check: { condition: service_completed_successfully }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candydati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-candydati}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # The MinIO community images are no longer published on Docker Hub: Chainguard build, pinned by digest (tag: latest).
    image: cgr.dev/chainguard/minio:latest@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    restart: unless-stopped
    command: server /data --console-address ":9001"
    depends_on:
      config-check: { condition: service_completed_successfully }
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?imposta S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks: [internal]

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [internal]

  api:
    build: { context: ., target: api }
    image: ${CANDYDATI_IMAGE_PREFIX:-ghcr.io/fabrilallo/candydati}-api:${CANDYDATI_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      API_PORT: "4000"
      API_HOST: 0.0.0.0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?imposta BETTER_AUTH_SECRET (almeno 32 caratteri)}
      BETTER_AUTH_URL: ${PLATFORM_URL}
      WEB_ORIGIN: ${PLATFORM_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-}
      # The api trusts x-forwarded-for only from the web container, which has a fixed address (CANDYDATI_WEB_IP, inside CANDYDATI_SUBNET).
      # Never a whole subnet and never "true": anything else on the network could forge a client address.
      TRUST_PROXY: ${TRUST_PROXY:-${CANDYDATI_WEB_IP:-172.31.77.10}}
      APPLICATIONS_DAILY_MAX_PER_ORGANIZATION: ${APPLICATIONS_DAILY_MAX_PER_ORGANIZATION:-500}
      APPLICATIONS_DAILY_MAX_PER_JOB: ${APPLICATIONS_DAILY_MAX_PER_JOB:-200}
      RECEIPTS_DAILY_MAX_PER_ORGANIZATION: ${RECEIPTS_DAILY_MAX_PER_ORGANIZATION:-300}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:?imposta INBOUND_WEBHOOK_SECRET (almeno 32 caratteri)}
      # invite_only (default in production): accounts only through an invitation, plus the first owner (SECURITY.md).
      SIGNUP_MODE: ${SIGNUP_MODE:-invite_only}
      # One-time secret of the first owner's sign-up (/signup?setup). Needed once to bootstrap, then remove it from .env.
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      # Who may create organizations: empty = one_per_user with invite_only (open | one_per_user | instance_admins).
      ORGANIZATION_CREATION: ${ORGANIZATION_CREATION:-}
      INSTANCE_ADMIN_EMAILS: ${INSTANCE_ADMIN_EMAILS:-}
      API_KEY_DEFAULT_TTL_DAYS: ${API_KEY_DEFAULT_TTL_DAYS:-90}
      MCP_MODEL_DAILY_BUDGET_PER_KEY: ${MCP_MODEL_DAILY_BUDGET_PER_KEY:-200}
      MCP_MODEL_DAILY_BUDGET_PER_ORGANIZATION: ${MCP_MODEL_DAILY_BUDGET_PER_ORGANIZATION:-1000}
      MCP_MODEL_DAILY_BUDGET_PER_USER: ${MCP_MODEL_DAILY_BUDGET_PER_USER:-300}
      ASSISTANT_DAILY_BUDGET_PER_USER: ${ASSISTANT_DAILY_BUDGET_PER_USER:-200}
      ASSISTANT_DAILY_BUDGET_PER_ORGANIZATION: ${ASSISTANT_DAILY_BUDGET_PER_ORGANIZATION:-2000}
    ports:
      - "${API_PUBLISH:-127.0.0.1:4000}:4000"
    networks: [internal]

  worker:
    build: { context: ., target: worker }
    image: ${CANDYDATI_IMAGE_PREFIX:-ghcr.io/fabrilallo/candydati}-worker:${CANDYDATI_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *app-env
      # Derives the key that keeps a migration connector's credentials encrypted while its fetch runs.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?imposta BETTER_AUTH_SECRET (almeno 32 caratteri)}
      # Health server of the worker (/health, /ready, /metrics): internal network only, never published.
      WORKER_PORT: ${WORKER_PORT:-4001}
      WORKER_HOST: ${WORKER_HOST:-0.0.0.0}
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.WORKER_PORT||4001;if(p==='0')process.exit(0);fetch('http://127.0.0.1:'+p+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      target: web
      args:
        NUXT_PUBLIC_PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
    image: ${CANDYDATI_IMAGE_PREFIX:-ghcr.io/fabrilallo/candydati}-web:${CANDYDATI_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NUXT_API_INTERNAL_URL: http://api:4000
      NUXT_PUBLIC_PLATFORM_NAME: ${PLATFORM_NAME:-Candydati}
      NUXT_PUBLIC_PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
      NUXT_PUBLIC_SITE_URL: ${PLATFORM_URL}
      NUXT_PUBLIC_TIME_ZONE: ${NUXT_PUBLIC_TIME_ZONE:-Europe/Rome}
      NUXT_PUBLIC_SOURCE_URL: ${NUXT_PUBLIC_SOURCE_URL:-}
      NUXT_API_MAX_BODY_BYTES: ${NUXT_API_MAX_BODY_BYTES:-213909504}
      NUXT_API_TIMEOUT_MS: ${NUXT_API_TIMEOUT_MS:-300000}
      NUXT_TRUST_CLOUDFLARE: ${NUXT_TRUST_CLOUDFLARE:-false}
      # The bundled Caddy (profile caddy): its x-forwarded-for names the visitor. Set by deploy/install.sh.
      NUXT_TRUSTED_PROXY: ${NUXT_TRUSTED_PROXY:-}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NUXT_SENTRY_DSN: ${NUXT_SENTRY_DSN:-}
    ports:
      # WEB_BIND=127.0.0.1 when a reverse proxy on the same host (Caddy, nginx, Traefik) is the only way in.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    networks:
      internal:
        ipv4_address: ${CANDYDATI_WEB_IP:-172.31.77.10}

  # Automatic HTTPS for the one-command install (deploy/install.sh): COMPOSE_PROFILES=caddy and CANDYDATI_DOMAIN in .env.
  # Leave it off behind another proxy (Dokploy's Traefik, nginx, a Caddy on the host): then use WEB_BIND/WEB_PORT.
  caddy:
    profiles: [caddy]
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    environment:
      CANDYDATI_DOMAIN: ${CANDYDATI_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      internal:
        # Fixed, like the web's: the web believes x-forwarded-for from this address only (NUXT_TRUSTED_PROXY).
        ipv4_address: ${CANDYDATI_CADDY_IP:-172.31.77.11}

  # Scheduled pg_dump (custom format) with retention, optionally uploaded to S3 (docs/OPERATIONS.md, Backups):
  #   docker compose -f docker-compose.prod.yml --profile backup up -d
  # One backup now: docker compose -f docker-compose.prod.yml --profile backup run --rm backup backup.sh once
  backup:
    profiles: [backup]
    build: { context: ./docker, dockerfile: backup.Dockerfile }
    image: ${CANDYDATI_IMAGE_PREFIX:-ghcr.io/fabrilallo/candydati}-backup:${CANDYDATI_VERSION:-local}
    restart: unless-stopped
    command: ["backup.sh", "loop"]
    depends_on:
      # The api applies the migrations and creates the bucket: the first backup (at start) is then a real one.
      api: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-candydati}
      PGPASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-candydati}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      # Upload: to the platform's MinIO by default (a second copy on the same disk: point BACKUP_S3_* at another provider).
      BACKUP_UPLOAD: ${BACKUP_UPLOAD:-true}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://minio:9000}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-${S3_REGION:-us-east-1}}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-${S3_BUCKET:-candydati}}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-${S3_ACCESS_KEY:-}}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-${S3_SECRET_KEY:-}}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_S3_PATH_STYLE: ${BACKUP_S3_PATH_STYLE:-true}
      # AES256 (S3 managed keys) or aws:kms; empty = none. MinIO needs a KMS configured before it accepts it.
      BACKUP_S3_SSE: ${BACKUP_S3_SSE:-}
    volumes:
      - backups:/backups
    networks: [internal]
    healthcheck:
      # A successful backup in the last 26 hours (the first one runs at start).
      test: ["CMD-SHELL", "find /backups/last-success -mmin -1560 2>/dev/null | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m

networks:
  internal:
    ipam:
      config:
        - subnet: ${CANDYDATI_SUBNET:-172.31.77.0/24}

volumes:
  pgdata:
  miniodata:
  backups:
  caddydata:
  caddyconfig:
