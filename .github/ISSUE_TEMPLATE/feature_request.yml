name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected (recruiter, hiring manager, candidate, self-hoster) and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with the product
      options:
        - label: It does not rank, score or reject candidates automatically
        - label: It does not weaken transparency (salary range, declared process, outcome for everyone) or GDPR guarantees
