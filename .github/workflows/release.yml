name: Release

# A tag vX.Y.Z (equal to the version in package.json) publishes:
# - the images ghcr.io/<owner>/candydati-{api,worker,web,backup}:X.Y.Z (amd64 + arm64, built natively, no emulation),
#   also tagged X.Y and latest unless the version is a pre-release (X.Y.Z-rc.1);
# - a GitHub release with install.sh, the deploy bundle (compose file, config check, Caddyfile, CLI) and SHA256SUMS.
# The first time, make the four packages public (GitHub, Packages, Package settings) so servers can pull them.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          expected=$(node -p "require('./package.json').version")
          if [ "$version" != "$expected" ]; then
            echo "::error::tag $TAG does not match package.json version $expected"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  image:
    name: image ${{ matrix.target }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [api, worker, web, backup]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/candydati-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only: the multi-arch tags are written once both architectures exist (job manifest).
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.target == 'backup' && './docker' || '.' }}
          file: ${{ matrix.target == 'backup' && './docker/backup.Dockerfile' || './Dockerfile' }}
          target: ${{ matrix.target != 'backup' && matrix.target || '' }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=BUSL-1.1
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}-${{ matrix.arch }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    name: tags ${{ matrix.target }}
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker, web, backup]
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.target }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET: ${{ matrix.target }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/candydati-$TARGET"
          tags=(-t "$image:$VERSION")
          if [ "$PRERELEASE" = "false" ]; then tags+=(-t "$image:${VERSION%.*}" -t "$image:latest"); fi
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:$VERSION"

  release:
    name: GitHub release
    needs: [version, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Forks publish under their own name: the repository and the image owner are written into the files.
      - name: Deploy bundle
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p dist
          sed -i "s#ghcr.io/fabrilallo/candydati#ghcr.io/$owner/candydati#" docker-compose.prod.yml
          sed -i "s#fabrilallo/candydati#$GITHUB_REPOSITORY#" deploy/install.sh deploy/candydati
          tar -czf dist/candydati-deploy.tar.gz docker-compose.prod.yml docker/config-check.sh deploy/Caddyfile deploy/candydati
          cp deploy/install.sh dist/install.sh
          (cd dist && sha256sum candydati-deploy.tar.gz install.sh > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "Candydati ${TAG#v}")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/install.sh dist/candydati-deploy.tar.gz dist/SHA256SUMS
