name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Organization-owned repositories need a free GITLEAKS_LICENSE secret (https://gitleaks.io); personal ones do not.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: dependency audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No pnpm cache: this job installs nothing, so the store path does not exist and setup-node v7 fails saving it.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Fails on high or critical advisories in production dependencies.
      # Dev-only chains are out of scope (--prod). Advisories judged not exploitable here are listed, with a reason and
      # a review date, in .github/audit-allowlist.txt (one GHSA id per line, "#" starts a comment).
      - name: Audit production dependencies
        run: |
          ignores=()
          while read -r id; do
            [ -n "$id" ] && ignores+=(--ignore "$id")
          done < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' .github/audit-allowlist.txt | grep -v '^$' || true)
          pnpm audit --prod --audit-level=high "${ignores[@]}"
