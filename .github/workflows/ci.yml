name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tt
          POSTGRES_PASSWORD: tt
          POSTGRES_DB: team_tracker
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tt -d team_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://tt:tt@localhost:5434/team_tracker
      TEST_DATABASE_URL: postgres://tt:tt@localhost:5434/team_tracker_test
      # CI-only dummy value. Never used outside this workflow.
      BETTER_AUTH_SECRET: ci-only-dummy-secret-0123456789abcdef
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Version is read from the "packageManager" field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
