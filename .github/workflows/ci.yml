name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: candydati
          POSTGRES_PASSWORD: candydati
          POSTGRES_DB: candydati
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U candydati -d candydati"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Mailpit: SMTP on :1025, UI/API on :8025 (same image as docker-compose.yml).
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://candydati:candydati@localhost:5434/candydati
      TEST_DATABASE_URL: postgres://candydati:candydati@localhost:5434/candydati_test
      API_TEST_DATABASE_URL: postgres://candydati:candydati@localhost:5434/candydati_api_test
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: candydati-test
      S3_ACCESS_KEY: candydati-minio
      S3_SECRET_KEY: candydati-minio-secret
      S3_FORCE_PATH_STYLE: "true"
      EMAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_DOMAIN: localhost
      EMAIL_INBOUND_DOMAIN: inbound.localhost
      # CI-only dummy values. Never used outside this workflow.
      BETTER_AUTH_SECRET: ci-only-dummy-secret-0123456789abcdef
      INBOUND_WEBHOOK_SECRET: ci-only-dummy-webhook-secret-0123456789abcdef
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MinIO (Chainguard build, same digest as docker-compose.yml): a service container cannot pass the command.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=candydati-minio -e MINIO_ROOT_PASSWORD=candydati-minio-secret \
            cgr.dev/chainguard/minio:latest@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56 server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      # Version is read from the "packageManager" field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The installer and the server CLI run as root on people's servers (shellcheck is on the GitHub runners).
      - name: Shellcheck
        run: shellcheck deploy/install.sh deploy/candydati docker/*.sh

      # The Drizzle snapshots must match the schema: `check` validates the migration history and `generate` must
      # produce nothing (no new file, no change).
      - name: Migration drift
        run: |
          pnpm --filter @candydati/db exec drizzle-kit check
          pnpm --filter @candydati/db exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "::error::The schema changed without a migration: run pnpm db:generate and commit the result."
            git status --porcelain -- packages/db/drizzle
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: candydati
          POSTGRES_PASSWORD: candydati
          POSTGRES_DB: candydati
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U candydati -d candydati"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # The stack runs from the built output: api on :4100, web on :3000 (the api trusts X-Forwarded-For from loopback only).
      DATABASE_URL: postgres://candydati:candydati@localhost:5434/candydati
      PLATFORM_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      API_PORT: "4100"
      NUXT_API_INTERNAL_URL: http://localhost:4100
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: candydati-e2e
      S3_ACCESS_KEY: candydati-minio
      S3_SECRET_KEY: candydati-minio-secret
      S3_FORCE_PATH_STYLE: "true"
      EMAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_DOMAIN: localhost
      EMAIL_INBOUND_DOMAIN: inbound.localhost
      # The e2e specs sign up their own users (and confirm the address through Mailpit): open sign-up.
      SIGNUP_MODE: open
      # CI-only dummy values. Never used outside this workflow.
      BETTER_AUTH_SECRET: ci-only-dummy-secret-0123456789abcdef
      INBOUND_WEBHOOK_SECRET: ci-only-dummy-webhook-secret-0123456789abcdef
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:4100
      MAILPIT_URL: http://localhost:8025
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=candydati-minio -e MINIO_ROOT_PASSWORD=candydati-minio-secret \
            cgr.dev/chainguard/minio:latest@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56 server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @candydati/e2e exec playwright install --with-deps chromium

      # The api applies the migrations at start (RUN_MIGRATIONS defaults to on) and creates the bucket.
      - name: Start api, worker and web
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          (cd apps/api && nohup node dist/index.js > "$RUNNER_TEMP/logs/api.log" 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4100/api/health && break
            sleep 2
          done
          (cd apps/worker && nohup node dist/index.js > "$RUNNER_TEMP/logs/worker.log" 2>&1 &)
          (cd apps/web && PORT=3000 nohup node .output/server/index.mjs > "$RUNNER_TEMP/logs/web.log" 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 2
          done
          tail -n 50 "$RUNNER_TEMP"/logs/*.log
          exit 1

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-logs
          path: ${{ runner.temp }}/logs
          retention-days: 7

  docker:
    name: docker images (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only, no push. The layer cache lives in the GitHub Actions cache.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: candydati-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
