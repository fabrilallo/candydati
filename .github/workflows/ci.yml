name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tt
          POSTGRES_PASSWORD: tt
          POSTGRES_DB: team_tracker
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tt -d team_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Mailpit: SMTP su :1025, UI/API su :8025 (stessa immagine di docker-compose.yml).
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://tt:tt@localhost:5434/team_tracker
      TEST_DATABASE_URL: postgres://tt:tt@localhost:5434/team_tracker_test
      API_TEST_DATABASE_URL: postgres://tt:tt@localhost:5434/team_tracker_api_test
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: team-tracker-test
      S3_ACCESS_KEY: tt-minio
      S3_SECRET_KEY: tt-minio-secret
      S3_FORCE_PATH_STYLE: "true"
      EMAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_DOMAIN: localhost
      EMAIL_INBOUND_DOMAIN: inbound.localhost
      # CI-only dummy values. Never used outside this workflow.
      BETTER_AUTH_SECRET: ci-only-dummy-secret-0123456789abcdef
      INBOUND_WEBHOOK_SECRET: ci-only-dummy-webhook-secret-0123456789abcdef
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # MinIO (build Chainguard, come in docker-compose.yml): un service container non puo' passare il comando.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tt-minio -e MINIO_ROOT_PASSWORD=tt-minio-secret \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      # Version is read from the "packageManager" field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  docker:
    name: docker images (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Solo build, nessun push. La cache di layer vive nella cache di GitHub Actions.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: team-tracker-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
