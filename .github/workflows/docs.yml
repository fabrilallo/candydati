name: Docs

# Builds the documentation site (website/, VitePress) and publishes it on GitHub Pages.
# Pages source: Settings, Pages, Build and deployment, Source "GitHub Actions".
# Custom domain: set the repository variable DOCS_DOMAIN (for example docs.example.com); the site is then built for "/"
# and a CNAME file is published with it. Without it the site lives at https://<owner>.github.io/<repository>/.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version is read from the "packageManager" field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @candydati/website...

      - name: Build
        env:
          DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$DOCS_DOMAIN" ]; then export DOCS_BASE=/; else export DOCS_BASE="/$REPOSITORY_NAME/"; fi
          pnpm --filter @candydati/website build
          if [ -n "$DOCS_DOMAIN" ]; then printf '%s\n' "$DOCS_DOMAIN" > website/.vitepress/dist/CNAME; fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    name: publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
