name: Docs

# Builds the documentation site (website/, VitePress) and publishes it on GitHub Pages.
# Pages source: Settings, Pages, Build and deployment, Source "GitHub Actions".
# Custom domain: set the repository variable DOCS_DOMAIN (for example docs.example.com); the site is then built for "/"
# and a CNAME file is published with it. Without it the site lives at https://<owner>.github.io/<repository>/.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Version is read from the "packageManager" field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @candydati/website...

      - name: Build
        env:
          DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$DOCS_DOMAIN" ]; then export DOCS_BASE=/; else export DOCS_BASE="/$REPOSITORY_NAME/"; fi
          pnpm --filter @candydati/website build
          if [ -n "$DOCS_DOMAIN" ]; then printf '%s\n' "$DOCS_DOMAIN" > website/.vitepress/dist/CNAME; fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/.vitepress/dist

  deploy:
    name: publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
