version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # vue-tsc 3.3.12 and 3.3.13 lose v-for and scoped slot variables in templates (TS2304 on `item`, `index`,
      # `invalid`, `describedBy`): stay on 3.3.11 until a release fixes it.
      - dependency-name: vue-tsc
        versions: ["3.3.12", "3.3.13"]
      # Nuxt 4 runs on Nitro 2, whose events are h3 1: the server middleware in apps/web cannot move to h3 2 before
      # Nuxt moves to Nitro 3.
      - dependency-name: h3
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A major Postgres version cannot read the previous one's data directory: upgrading needs pg_upgrade or a
      # dump and restore, planned and documented (docs/OPERATIONS.md), never an automatic pull request.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A major Postgres version cannot read the previous one's data directory: upgrading needs pg_upgrade or a
      # dump and restore, planned and documented (docs/OPERATIONS.md), never an automatic pull request.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
