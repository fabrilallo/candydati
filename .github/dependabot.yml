version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A major Postgres version cannot read the previous one's data directory: upgrading needs pg_upgrade or a
      # dump and restore, planned and documented (docs/OPERATIONS.md), never an automatic pull request.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A major Postgres version cannot read the previous one's data directory: upgrading needs pg_upgrade or a
      # dump and restore, planned and documented (docs/OPERATIONS.md), never an automatic pull request.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
