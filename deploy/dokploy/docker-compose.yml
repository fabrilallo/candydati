# Candydati for Dokploy, generated from docker-compose.prod.yml: do not edit, run
# `pnpm --filter @candydati/tools dokploy-template`. Guide: docs/deploy/dokploy.md.
services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candydati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-candydati}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?imposta S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks:
      - internal
  api:
    image: ghcr.io/fabrilallo/candydati-api:${CANDYDATI_VERSION:-0.1.3}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-candydati}:${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-candydati}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-candydati}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?imposta S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      PLATFORM_NAME: ${PLATFORM_NAME:-Candydati}
      PLATFORM_URL: ${PLATFORM_URL:?imposta PLATFORM_URL}
      PLATFORM_SUPPORT_EMAIL: ${PLATFORM_SUPPORT_EMAIL:-support@example.com}
      PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
      PLATFORM_TIME_ZONE: ${PLATFORM_TIME_ZONE:-Europe/Rome}
      PLATFORM_AD_QUALITY_THRESHOLD: ${PLATFORM_AD_QUALITY_THRESHOLD:-6}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-localhost}
      EMAIL_FROM_LOCAL: ${EMAIL_FROM_LOCAL:-noreply}
      EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
      WEBHOOKS_ALLOW_PRIVATE: "false"
      AGENT_MODEL: ${AGENT_MODEL:-}
      FAST_MODEL: ${FAST_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CV_MODEL_DAILY_BUDGET: ${CV_MODEL_DAILY_BUDGET:-1000}
      IMPORT_STALE_DAYS: ${IMPORT_STALE_DAYS:-7}
      DELIVERY_LOG_RETENTION_DAYS: ${DELIVERY_LOG_RETENTION_DAYS:-30}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-${CANDYDATI_VERSION:-}}
      RUN_MIGRATIONS: "true"
      API_PORT: "4000"
      API_HOST: 0.0.0.0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?imposta BETTER_AUTH_SECRET (almeno 32 caratteri)}
      BETTER_AUTH_URL: ${PLATFORM_URL}
      WEB_ORIGIN: ${PLATFORM_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-}
      TRUST_PROXY: ${TRUST_PROXY:-${CANDYDATI_WEB_IP:-172.31.77.10}}
      APPLICATIONS_DAILY_MAX_PER_ORGANIZATION: ${APPLICATIONS_DAILY_MAX_PER_ORGANIZATION:-500}
      APPLICATIONS_DAILY_MAX_PER_JOB: ${APPLICATIONS_DAILY_MAX_PER_JOB:-200}
      RECEIPTS_DAILY_MAX_PER_ORGANIZATION: ${RECEIPTS_DAILY_MAX_PER_ORGANIZATION:-300}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:?imposta INBOUND_WEBHOOK_SECRET (almeno 32 caratteri)}
      SIGNUP_MODE: ${SIGNUP_MODE:-invite_only}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      ORGANIZATION_CREATION: ${ORGANIZATION_CREATION:-}
      INSTANCE_ADMIN_EMAILS: ${INSTANCE_ADMIN_EMAILS:-}
      API_KEY_DEFAULT_TTL_DAYS: ${API_KEY_DEFAULT_TTL_DAYS:-90}
      MCP_MODEL_DAILY_BUDGET_PER_KEY: ${MCP_MODEL_DAILY_BUDGET_PER_KEY:-200}
      MCP_MODEL_DAILY_BUDGET_PER_ORGANIZATION: ${MCP_MODEL_DAILY_BUDGET_PER_ORGANIZATION:-1000}
      MCP_MODEL_DAILY_BUDGET_PER_USER: ${MCP_MODEL_DAILY_BUDGET_PER_USER:-300}
      ASSISTANT_DAILY_BUDGET_PER_USER: ${ASSISTANT_DAILY_BUDGET_PER_USER:-200}
      ASSISTANT_DAILY_BUDGET_PER_ORGANIZATION: ${ASSISTANT_DAILY_BUDGET_PER_ORGANIZATION:-2000}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
  worker:
    image: ghcr.io/fabrilallo/candydati-worker:${CANDYDATI_VERSION:-0.1.3}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-candydati}:${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-candydati}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-candydati}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?imposta S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?imposta S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      PLATFORM_NAME: ${PLATFORM_NAME:-Candydati}
      PLATFORM_URL: ${PLATFORM_URL:?imposta PLATFORM_URL}
      PLATFORM_SUPPORT_EMAIL: ${PLATFORM_SUPPORT_EMAIL:-support@example.com}
      PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
      PLATFORM_TIME_ZONE: ${PLATFORM_TIME_ZONE:-Europe/Rome}
      PLATFORM_AD_QUALITY_THRESHOLD: ${PLATFORM_AD_QUALITY_THRESHOLD:-6}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-localhost}
      EMAIL_FROM_LOCAL: ${EMAIL_FROM_LOCAL:-noreply}
      EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
      WEBHOOKS_ALLOW_PRIVATE: "false"
      AGENT_MODEL: ${AGENT_MODEL:-}
      FAST_MODEL: ${FAST_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CV_MODEL_DAILY_BUDGET: ${CV_MODEL_DAILY_BUDGET:-1000}
      IMPORT_STALE_DAYS: ${IMPORT_STALE_DAYS:-7}
      DELIVERY_LOG_RETENTION_DAYS: ${DELIVERY_LOG_RETENTION_DAYS:-30}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-${CANDYDATI_VERSION:-}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?imposta BETTER_AUTH_SECRET (almeno 32 caratteri)}
      WORKER_PORT: ${WORKER_PORT:-4001}
      WORKER_HOST: ${WORKER_HOST:-0.0.0.0}
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const p=process.env.WORKER_PORT||4001;if(p==='0')process.exit(0);fetch('http://127.0.0.1:'+p+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy
  web:
    image: ghcr.io/fabrilallo/candydati-web:${CANDYDATI_VERSION:-0.1.3}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NUXT_API_INTERNAL_URL: http://api:4000
      NUXT_PUBLIC_PLATFORM_NAME: ${PLATFORM_NAME:-Candydati}
      NUXT_PUBLIC_PLATFORM_DEFAULT_LOCALE: ${PLATFORM_DEFAULT_LOCALE:-it}
      NUXT_PUBLIC_SITE_URL: ${PLATFORM_URL}
      NUXT_PUBLIC_TIME_ZONE: ${NUXT_PUBLIC_TIME_ZONE:-Europe/Rome}
      NUXT_PUBLIC_SOURCE_URL: ${NUXT_PUBLIC_SOURCE_URL:-}
      NUXT_API_MAX_BODY_BYTES: ${NUXT_API_MAX_BODY_BYTES:-213909504}
      NUXT_API_TIMEOUT_MS: ${NUXT_API_TIMEOUT_MS:-300000}
      NUXT_TRUST_CLOUDFLARE: ${NUXT_TRUST_CLOUDFLARE:-false}
      NUXT_TRUSTED_PROXY: ${NUXT_TRUSTED_PROXY:-}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NUXT_SENTRY_DSN: ${NUXT_SENTRY_DSN:-}
    networks:
      internal:
        ipv4_address: ${CANDYDATI_WEB_IP:-172.31.77.10}
    depends_on:
      api:
        condition: service_healthy
  backup:
    image: ghcr.io/fabrilallo/candydati-backup:${CANDYDATI_VERSION:-0.1.3}
    restart: unless-stopped
    command:
      - backup.sh
      - loop
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-candydati}
      PGPASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-candydati}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_UPLOAD: ${BACKUP_UPLOAD:-true}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://minio:9000}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-${S3_REGION:-us-east-1}}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-${S3_BUCKET:-candydati}}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-${S3_ACCESS_KEY:-}}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-${S3_SECRET_KEY:-}}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_S3_PATH_STYLE: ${BACKUP_S3_PATH_STYLE:-true}
      BACKUP_S3_SSE: ${BACKUP_S3_SSE:-}
    volumes:
      - backups:/backups
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - find /backups/last-success -mmin -1560 2>/dev/null | grep -q .
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
    depends_on:
      api:
        condition: service_healthy
networks:
  internal:
    ipam:
      config:
        - subnet: ${CANDYDATI_SUBNET:-172.31.77.0/24}
volumes:
  pgdata: null
  miniodata: null
  backups: null
