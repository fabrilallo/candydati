name: candydati

services:
  postgres:
    image: postgres:17@sha256:4d89c904835259bc58876520e56267ca07a4ebd6a027f7814bbbf91b50d685be
    container_name: candydati-postgres
    environment:
      POSTGRES_USER: candydati
      POSTGRES_PASSWORD: candydati
      POSTGRES_DB: candydati
    ports:
      - "5434:5432"
    volumes:
      - candydati-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candydati -d candydati"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # The MinIO community images are no longer published on Docker Hub or quay.io: this is the Chainguard build,
    # pinned by digest (tag: latest). Bump the digest on purpose.
    image: cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    container_name: candydati-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: candydati-minio
      MINIO_ROOT_PASSWORD: candydati-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - candydati-minio:/data

  mailpit:
    # Development SMTP: accepts everything and shows messages in the UI on :8025 (nothing is delivered).
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    container_name: candydati-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  candydati-pgdata:
  candydati-minio:
