packages:
  - apps/*
  - packages/*
  - e2e
  - tools
  - website
auditConfig:
  ignoreGhsas:
    - GHSA-v5rq-49vh-5v5c
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
# @nuxt/schema imports vite's types without declaring it, so they came from whichever vite pnpm hoisted (vite 5 from
# VitePress in website/ broke `nuxt typecheck` on vite.plugins). Pin it to the vite the Nuxt builder uses.
packageExtensions:
  '@nuxt/schema@4':
    dependencies:
      vite: ^8.3.2
onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@tailwindcss/oxide'
  - unrs-resolver
# Do not install a version published less than 7 days ago (minutes): a compromised release is usually pulled within days.
minimumReleaseAge: 10080
