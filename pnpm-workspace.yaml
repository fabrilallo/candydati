packages:
  - apps/*
  - packages/*
  - e2e
  - tools
auditConfig:
  ignoreGhsas:
    - GHSA-v5rq-49vh-5v5c
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@tailwindcss/oxide'
  - unrs-resolver
# Do not install a version published less than 7 days ago (minutes): a compromised release is usually pulled within days.
minimumReleaseAge: 10080
